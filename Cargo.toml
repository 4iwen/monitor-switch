[package]
name = "monitor-switch"
version = "0.2.1"
edition = "2021"
rust-version = "1.82"
description = "A lightweight native menu-bar monitor input switcher using DDC/CI."
license = "MIT"
readme = "README.md"
keywords = ["ddc", "monitor", "display", "macos", "windows"]
categories = ["hardware-support", "command-line-utilities"]

[build-dependencies]
embed-resource = "3.0.11"

[dependencies]
clap = { version = "4", features = ["derive"] }
ddc = "0.2"
ddc-hi = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.35"
thiserror = "1"
toml = "0.8"
tray-icon = "0.24"
wry = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
ddc-macos = "0.2.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

[target.'cfg(target_os = "windows")'.dependencies]
ddc-winapi = "0.2"
winapi = { version = "0.3", features = ["winuser"] }

[features]
default = []

[[bin]]
name = "monitor-switch"
path = "src/main.rs"

[[bin]]
name = "monitor-switch-app"
path = "src/bin/monitor-switch-app.rs"
